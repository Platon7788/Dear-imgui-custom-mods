[package]
name = "dear-imgui-custom-mod"
version = "0.11.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Custom UI components for dear-imgui-rs"

# ─── Features ────────────────────────────────────────────────────────────────
#
# All components are on by default (`full` + backend). Downstream consumers
# who want a slimmer build can `--no-default-features --features=confirm_dialog`
# (for example) and compile only what they need. `theme`, `utils`, `icons`,
# `fonts`, `i18n` are always-on infrastructure — not exposed as features.
#
# Widget components emit dear-imgui draw-lists ONLY — they never touch
# `wgpu` / `winit`. The heavy GPU + windowing stack lives behind three
# opt-in backend features (`render`, `input`, `chrome`) so pulling 2-3
# components does NOT drag in wgpu/winit and its transitive tree. The
# `default` set re-enables them for a batteries-included experience, so
# existing consumers are unaffected; slim consumers opt out via
# `default-features = false`.
#
# Inter-component dependencies are encoded transitively so toggling one
# leaf component does the right thing (e.g. enabling `disasm_view`
# automatically pulls `hex_viewer`; enabling `chrome` pulls `input`).

[features]
default = ["full", "render", "chrome"]

# Meta-feature: every component.
full = [
    "code_editor",
    "confirm_dialog",
    "diff_viewer",
    "disasm_view",
    "file_manager",
    "hex_viewer",
    "nav_panel",
    "node_graph",
    "notifications",
    "tab_control",
    "property_inspector",
    "status_bar",
    "timeline",
    "toolbar",
    "virtual_table",
    "virtual_tree",
]

# Note: the previous `app_window` feature (borderless runner) was removed in
# the 2026 architectural refactor. Its replacement, `chrome::*`, is always-on
# infrastructure (no feature flag) — chrome helpers are tiny and broadly
# applicable, while the runner machinery moved out of the crate (use
# `dear-app` or your own winit + wgpu loop).

# ── Dialogs & small widgets ─────────────────────────────────────────────────
confirm_dialog = []
nav_panel = []
# Toast-notification center — severity-tinted popups with stacking, progress,
# actions, 6 placements, fade/slide animations. Fully custom draw-list icons
# so it's font-independent.
notifications = []
status_bar = []
toolbar = []
property_inspector = []

# ── Data viewers ────────────────────────────────────────────────────────────
diff_viewer = []
file_manager = []
hex_viewer = []
# disasm_view reuses hex_viewer's NavHistory type and depends on the
# headless `disasm-knowledge` crate for x86 catalogues (mnemonic /
# idiom / boundary / antidisasm / compiler / abi / operand / branch).
disasm_view = ["hex_viewer", "dep:disasm-knowledge"]
virtual_table = []
# virtual_tree shares column + cell types with virtual_table.
virtual_tree = ["virtual_table"]

# ── Specialized ─────────────────────────────────────────────────────────────
# Heavy: embeds 3 TTF fonts (Hack + JetBrains Mono + JetBrains Mono NL)
# and ~10 languages of syntax highlighting. The single biggest size
# contributor in the crate.
code_editor = []
# Full visual node editor — bezier wires, selection, pan/zoom, mini-map.
node_graph = []
# Modern tab controller (DevExpress XtraTabControl-inspired). 3 styles
# (Pill / Underline / Square), pinned tabs, drag-reorder, scroll, overflow
# dropdown, close confirmation, dirty indicator, badges, status pulses,
# smooth scroll, single-pass hit-test, hover preview thumbnail. Pure tab
# strip — no dashboard/tile grid (use plain ImGui inside `render_content`).
tab_control = []
timeline = []
# Force-directed interactive graph viewer — Obsidian-style with Barnes-Hut
# physics, pan/zoom/drag/select, sidebar, PageRank/betweenness metrics,
# color groups, BFS depth filter, and SVG/DOT/Mermaid export (Phase D).
# Re-uses nav_panel palette for the sidebar. Requires slotmap for stable NodeId/EdgeId.
force_graph = ["nav_panel", "dep:slotmap"]

# ── Backend integration (opt-in) ────────────────────────────────────────────
# Widgets never need these — enable them only if you use the crate's own
# window chrome, keyboard/IME helpers, wgpu clear-color helpers, or want the
# wgpu / winit re-exports. Each pulls a slice of the heavy GPU + windowing
# dependency tree, so leaf-component builds stay lean without them.
#
# render → `utils::color::{wgpu_clear_color, is_srgb_surface_format}` +
#          the `wgpu` / `dear_imgui_wgpu` re-exports.
# input  → `crate::input` keyboard/IME helpers + the `winit` /
#          `dear_imgui_winit` re-exports.
# chrome → borderless-window chrome; dispatches keyboard events so it pulls
#          `input`.
render = ["dep:wgpu", "dep:dear-imgui-wgpu"]
input = ["dep:winit", "dep:dear-imgui-winit"]
chrome = ["input"]

[dependencies]
# Headless x86 disassembly knowledge — extracted in ADR-030 so the
# catalogues (mnemonic explanations, idiom / boundary / antidisasm /
# compiler-pattern / ABI / operand decoders) can be reused by CLI
# tools / IDA-style plugins / AI servers without dragging in
# dear-imgui / wgpu / winit. Gated by `disasm_view` so non-disasm
# downstream builds still skip the ~657 KB catalogue cost.
disasm-knowledge = { path = "../../useful-lib/disasm-knowledge", optional = true }
slotmap = { version = "1.1", optional = true }
serde = { version = "1", features = ["derive"] }
ron = "0.12"
dear-imgui-rs = "0.15.0"
foldhash = "0.2.0"

# ── Backend stack (optional; see the `render` / `input` / `chrome` features) ──
# Heavy GPU + windowing crates. Kept out of leaf-component builds so pulling
# a couple of widgets doesn't compile wgpu/winit and their transitive trees.
wgpu = { version = "29.0.3", optional = true }
dear-imgui-wgpu = { version = "0.15.0", optional = true }
winit = { version = "0.30.13", optional = true }
dear-imgui-winit = { version = "0.15.0", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Storage_FileSystem",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Performance",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
] }

[dev-dependencies]
# Microbenchmarks via Criterion — gate behind the `bench` runner so
# regular `cargo test` stays fast.
criterion = { version = "0.8", features = ["html_reports"] }
# Property-based testing for parser correctness — catches panics on
# malformed input that example-based tests would miss.
proptest = "1.11"

[[bench]]
name = "theme_dispatch"
harness = false

[[bench]]
name = "color_packing"
harness = false
