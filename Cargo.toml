# ─── Workspace root ──────────────────────────────────────────────────────────
#
# Two-package layout for clean DDD-style isolation between the published
# library and the dev-only demo runner:
#
#   crate/         — the publishable `dear-imgui-custom-mod` library.
#                    Carries `[dependencies]`, `[dev-dependencies]`,
#                    integration tests, and Criterion benches.
#
#   examples-app/  — `publish = false` runner that owns the 15 demos.
#                    Pulls the library through a `path = "../crate"`
#                    dependency. Also owns `assets/` (MDI icon font etc.)
#                    so they don't bloat the published crate tarball.
#
# `default-members = ["crate"]` makes plain `cargo build` / `cargo test`
# / `cargo clippy` work *only* on the library — examples-app is opt-in
# via `-p examples-app` or `--workspace`. Build profiles live here at
# the workspace root so both packages share them.

[workspace]
resolver = "2"
members = ["crate", "examples-app"]
default-members = ["crate"]

[workspace.package]
edition = "2024"
rust-version = "1.96"
license = "MIT"

# ─── Build profiles (shared) ─────────────────────────────────────────────────
#
# `dev.package."*" opt-level = 2` builds all *dependencies* (wgpu, imgui,
# winit, …) with near-release optimization while keeping
# our own crate at `opt-level = 0` for fast iterative compiles and full
# `debug_assertions`. Render hot paths (wgpu/imgui) then behave as if they
# were release-compiled — essential for GUI apps where a debug-compiled
# wgpu is ~10–30× slower.
#
# `release` mirrors the aggressive profile used by `IMGUI_NXT`: LTO=fat +
# single codegen unit give cross-crate inlining; `strip = symbols` removes
# PDB info; `panic = abort` drops the unwind machinery from the binary.

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"
