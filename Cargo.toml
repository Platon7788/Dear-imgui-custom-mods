[package]
name = "dear-imgui-custom-mod"
version = "0.9.0"
edition = "2024"
rust-version = "1.95"
description = "Custom UI components for dear-imgui-rs"
license = "MIT"

# ─── Features ────────────────────────────────────────────────────────────────
#
# All components are on by default (`full`). Downstream consumers who want a
# slimmer build can `--no-default-features --features=confirm_dialog` (for
# example) and compile only what they need. `theme`, `utils`, `icons`,
# `fonts`, `input` are always-on infrastructure — not exposed as features.
#
# Inter-component dependencies are encoded transitively so toggling one
# leaf component does the right thing (e.g. enabling `disasm_view`
# automatically pulls `hex_viewer`; enabling `app_window_v2` pulls
# `code_editor`).

[features]
default = ["full"]

# Meta-feature: every component.
full = [
    "app_window_v2",
    "code_editor",
    "confirm_dialog",
    "diff_viewer",
    "disasm_view",
    "file_manager",
    "hex_viewer",
    "nav_panel",
    "node_graph",
    "notifications",
    "tab_control",
    "proc_mon",
    "property_inspector",
    "status_bar",
    "timeline",
    "toolbar",
    "virtual_table",
    "virtual_tree",
]

# ── Window chrome ───────────────────────────────────────────────────────────
# app_window_v2: borderless wgpu+winit+ImGui host — pure ImGui hit detection,
# flat config, WM_GETMINMAXINFO-only Win32 subclass, no DWM frame extension.
# After the v1 / borderless_window removal (2026-04-29) this is the one
# and only host framework — Phase 2 of the refactor will rename it back
# to `app_window`.
app_window_v2 = ["code_editor"]

# ── Dialogs & small widgets ─────────────────────────────────────────────────
confirm_dialog = []
nav_panel = []
# Toast-notification center — severity-tinted popups with stacking, progress,
# actions, 6 placements, fade/slide animations. Fully custom draw-list icons
# so it's font-independent.
notifications = []
status_bar = []
toolbar = []
property_inspector = []

# ── Data viewers ────────────────────────────────────────────────────────────
diff_viewer = []
file_manager = []
hex_viewer = []
# disasm_view reuses hex_viewer's NavHistory type.
disasm_view = ["hex_viewer"]
virtual_table = []
# virtual_tree shares column + cell types with virtual_table.
virtual_tree = ["virtual_table"]

# ── Specialized ─────────────────────────────────────────────────────────────
# Heavy: embeds 3 TTF fonts (Hack + JetBrains Mono + JetBrains Mono NL)
# and ~10 languages of syntax highlighting. The single biggest size
# contributor in the crate.
code_editor = []
# Full visual node editor — bezier wires, selection, pan/zoom, mini-map.
node_graph = []
# Modern tab controller (DevExpress XtraTabControl-inspired). 3 styles
# (Pill / Underline / Square), pinned tabs, drag-reorder, scroll, overflow
# dropdown, close confirmation, dirty indicator, badges, status pulses,
# smooth scroll, single-pass hit-test, hover preview thumbnail. Pure tab
# strip — no dashboard/tile grid (use plain ImGui inside `render_content`).
tab_control = []
timeline = []
# Force-directed interactive graph viewer — Obsidian-style with Barnes-Hut
# physics, pan/zoom/drag/select, sidebar, PageRank/betweenness metrics,
# color groups, BFS depth filter, and SVG/DOT/Mermaid export (Phase D).
# Re-uses nav_panel palette for the sidebar. Requires slotmap for stable NodeId/EdgeId.
force_graph = ["nav_panel", "dep:slotmap"]
# Process monitor with NT syscall enumeration (Windows-only).
# Uses virtual_table for display. Requires rsc-runtime (SysCalls) crate.
proc_mon = ["virtual_table", "dep:rsc-runtime", "dep:serde"]

[dependencies]
slotmap = { version = "1.0", optional = true }
serde = { version = "1.0", features = ["derive"], optional = true }
dear-imgui-rs = "0.11.0"
dear-imgui-wgpu = "0.11.0"
dear-imgui-winit = "0.11.0"
foldhash = "0.2.0"
pollster = "0.4.0"
wgpu = "29.0.1"
winit = "0.30.13"

# ─── Optional: rsc-runtime (Windows-only) ───────────────────────────────────
# Direct NT syscall library for process monitoring.
# SysCalls (RSC): modern #![no_std] stubs, PDB-grounded canonical DB,
# JUMPER random-slide dispatch. Path dep to sibling workspace for now;
# switch to git dep (github.com/Platon7788/SysCalls) when publishing.
[target.'cfg(windows)'.dependencies]
rsc-runtime = { path = "../SysCalls/crates/rsc-runtime", optional = true }
windows-sys = { version = "0.61.2", features = [
    "Win32_Storage_FileSystem",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Performance",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
] }

[dev-dependencies]
# Microbenchmarks via Criterion — gate behind the `bench` runner so
# regular `cargo test` stays fast.
criterion = { version = "0.7", features = ["html_reports"] }
# Property-based testing for parser correctness — catches panics on
# malformed input that example-based tests would miss.
proptest = "1.8"

[[bench]]
name = "theme_dispatch"
harness = false

[[bench]]
name = "color_packing"
harness = false

# ─── Examples ────────────────────────────────────────────────────────────────
# Each demo declares `required-features` so `cargo build --examples
# --no-default-features --features=xxx` only builds the ones that can
# actually compile. With `default = ["full"]` this is transparent — every
# demo compiles unless you explicitly disable features.

[[example]]
name = "demo_table"
path = "examples/demo_table.rs"
required-features = ["virtual_table", "app_window_v2"]

[[example]]
name = "demo_node_graph"
path = "examples/demo_node_graph.rs"
required-features = ["node_graph", "app_window_v2"]

[[example]]
name = "demo_tree"
path = "examples/demo_tree.rs"
required-features = ["virtual_tree", "app_window_v2"]

[[example]]
name = "demo_code_editor"
path = "examples/demo_code_editor.rs"
required-features = ["code_editor", "app_window_v2"]

[[example]]
name = "demo_hex_viewer"
path = "examples/demo_hex_viewer.rs"
required-features = ["hex_viewer", "app_window_v2"]

[[example]]
name = "demo_disasm_view"
path = "examples/demo_disasm_view.rs"
required-features = ["disasm_view", "app_window_v2"]

[[example]]
name = "demo_file_manager"
path = "examples/demo_file_manager.rs"
required-features = ["file_manager", "app_window_v2"]

[[example]]
name = "demo_tab_control"
path = "examples/demo_tab_control.rs"
required-features = ["tab_control", "app_window_v2"]

[[example]]
name = "demo_timeline"
path = "examples/demo_timeline.rs"
required-features = ["timeline", "app_window_v2"]

[[example]]
name = "demo_diff_viewer"
path = "examples/demo_diff_viewer.rs"
required-features = ["diff_viewer", "app_window_v2"]

[[example]]
name = "demo_property_inspector"
path = "examples/demo_property_inspector.rs"
required-features = ["property_inspector", "app_window_v2"]

[[example]]
name = "demo_status_toolbar"
path = "examples/demo_status_toolbar.rs"
required-features = ["status_bar", "toolbar", "app_window_v2"]

[[example]]
name = "demo_app_window_v2"
path = "examples/demo_app_window_v2.rs"
required-features = ["app_window_v2", "confirm_dialog", "nav_panel", "status_bar"]

[[example]]
name = "demo_nav_panel"
path = "examples/demo_nav_panel.rs"
required-features = ["nav_panel", "app_window_v2"]

[[example]]
name = "demo_force_graph"
path = "examples/demo_force_graph.rs"
required-features = ["force_graph", "app_window_v2"]

[[example]]
name = "demo_proc_mon"
path = "examples/demo_proc_mon.rs"
required-features = ["proc_mon", "app_window_v2"]


# ─── Build profiles ──────────────────────────────────────────────────────────
#
# `dev.package."*" opt-level = 2` builds all *dependencies* (wgpu, imgui,
# winit, serde, syscalls, …) with near-release optimization while keeping
# our own crate at `opt-level = 0` for fast iterative compiles and full
# `debug_assertions`. Render hot paths (wgpu/imgui) then behave as if they
# were release-compiled — essential for GUI apps where a debug-compiled
# wgpu is ~10–30× slower.
#
# `release` mirrors the aggressive profile used by `IMGUI_NXT`: LTO=fat +
# single codegen unit give cross-crate inlining; `strip = symbols` removes
# PDB info; `panic = abort` drops the unwind machinery from the binary.

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"
